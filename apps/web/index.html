    <style>
      /* Splash: paints instantly, before the JS bundle arrives. Removed on mount. */
      #splash {
        position: fixed; inset: 0; z-index: 100;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
        background: #2a3a8c; color: #f4f5f8;
        transition: opacity 0.4s ease;
      }
      [data-theme="dark"] #splash { background: #12141d; color: #b5c2ef; }
      #splash.done { opacity: 0; pointer-events: none; }
      #splash svg { width: 108px; height: 108px; }
      #splash .word {
        font-family: "Outfit", system-ui, sans-serif; font-weight: 500; font-size: 1.35rem; letter-spacing: -0.01em;
      }
      #splash .mark { animation: splash-breathe 1.8s ease-in-out infinite; }
      @keyframes splash-breathe {
        0%, 100% { transform: scale(1); opacity: 1; }
        50% { transform: scale(0.94); opacity: 0.85; }
      }
      @media (prefers-reduced-motion: reduce) { #splash .mark { animation: none; } }
    </style>
  </head>
  <body>
    <script>
      // Apply the saved theme before anything paints (no light-flash at night).
      try {
        if (localStorage.getItem("mindfulverse.theme.v1") === "dark") {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      } catch (e) {}
    </script>
    <div id="splash" aria-hidden="true">
      <div class="mark"><!-- brand:splash --><svg xmlns="http://www.w3.org/2000/svg" viewBox="0.391 1.891 15.217 15.217"><path fill="currentColor" d="M13 7h1v4h-1zM12 5h1v1h-1zM14 5h1v1h-1zM9 10h5v1h-5zM9 5h1v6h-1zM7 5h2v1h-2zM5 8h1v3h-1zM5 12h1v1h-1zM2 10h4v1h-4zM2 10h1v4h-1zM1 13h1v1h-1z"/></svg><!-- /brand:splash -->
      </div>
      <div class="word">MindfulVerse</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
